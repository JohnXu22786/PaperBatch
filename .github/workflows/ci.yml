name: CI

on:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  windows-x64-lite-package:
    name: Windows x64 lite packaging prototype
    runs-on: windows-latest
    env:
      PB_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Publish lite package and provenance manifest
        id: package
        shell: pwsh
        run: ./tools/package_windows_x64.ps1

      - name: Verify package manifest and archive
        id: verify-package
        shell: pwsh
        run: |
          $manifestPath = 'artifacts/windows-x64-lite/package-manifest.json'
          $manifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
          if ($manifest.target -ne 'win-x64' -or -not $manifest.selfContained) { throw 'Unexpected package target.' }
          if ($manifest.license -ne 'AGPL-3.0-only' -or $manifest.signed) { throw 'Package legal or signing metadata is incorrect.' }
          if ($manifest.files.Count -eq 0) { throw 'Package manifest contains no files.' }
          if ($manifest.dependencyLockFiles.Count -ne 2) { throw 'Expected desktop and core dependency lockfiles.' }
          foreach ($lock in $manifest.dependencyLockFiles) {
            if (-not (Test-Path -LiteralPath $lock.path -PathType Leaf)) { throw "Source lockfile missing: $($lock.path)" }
            if ((Get-FileHash -LiteralPath $lock.path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $lock.sha256) { throw "Lockfile digest mismatch: $($lock.path)" }
          }
          foreach ($file in $manifest.files) {
            $path = Join-Path 'artifacts/windows-x64-lite' $file.path
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Manifest file missing: $($file.path)" }
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.sha256) { throw "Manifest digest mismatch: $($file.path)" }
          }
          foreach ($notice in @('LICENSE', 'THIRD-PARTY-UI-NOTICES.md', 'THIRD-PARTY-CORE-NOTICES.md', 'DOTNET-THIRD-PARTY-NOTICES.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path 'artifacts/windows-x64-lite' $notice) -PathType Leaf)) { throw "Package notice missing: $notice" }
          }
          $archive = 'artifacts/windows-x64-lite/PaperBatch-windows-x64-lite.zip'
          $checksum = "$archive.sha256"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw 'Package archive missing.' }
          if (-not (Test-Path -LiteralPath $checksum -PathType Leaf)) { throw 'Package archive checksum missing.' }
          $expected = (Get-Content -Raw $checksum).Trim() -split '\s+'
          if ($expected.Count -ne 2 -or $expected[1] -ne (Split-Path -Leaf $archive)) { throw 'Package archive checksum file is malformed.' }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected[0]) { throw 'Package archive digest mismatch.' }

      - name: Verify archive paths, payload, extraction, and tamper rejection
        shell: pwsh
        run: |
          python -m unittest tests.test_package_verifier
          python tools/verify_windows_package.py artifacts/windows-x64-lite artifacts/windows-x64-lite/PaperBatch-windows-x64-lite.zip

      - name: Simulate isolated startup, offline behavior, and package tree rollback
        id: package-session
        shell: pwsh
        run: ./tools/simulate_windows_package_session.ps1 -PackageDirectory artifacts/windows-x64-lite -PackageArchive artifacts/windows-x64-lite/PaperBatch-windows-x64-lite.zip

      - name: Upload bounded Windows package session report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u9-windows-package-session-report
          path: u9-windows-package-session-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unsigned development package
        uses: actions/upload-artifact@v4
        with:
          name: paperbatch-windows-x64-lite
          path: artifacts/windows-x64-lite/
          if-no-files-found: error
          retention-days: 14

      - name: Publish bounded exact-run package summary
        if: always()
        env:
          PB_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PB_JOB_RESULT: ${{ job.status }}
          PB_JOB_NAME: Windows x64 lite packaging prototype
          PB_STEP_OUTCOMES: '{"package":"${{ steps.package.outcome }}","verify":"${{ steps.verify-package.outcome }}","session":"${{ steps.package-session.outcome }}"}'
        run: python tools/build_ci_job_summary.py --title "Windows package and session evidence" --report u9-windows-package-session-report.json --report-required

  build-and-test:
    name: ${{ matrix.os }} / .NET 10, Avalonia, and Python
    runs-on: ${{ matrix.os }}
    env:
      PB_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore locked desktop dependencies
        id: restore
        run: dotnet restore tests/PaperBatch.Desktop.Tests/PaperBatch.Desktop.Tests.csproj --locked-mode -p:NuGetAudit=false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Use an isolated physical test temp directory on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test_temp="/private/tmp/pb-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$test_temp"
          printf 'TMPDIR=%s\n' "$test_temp" >> "$GITHUB_ENV"
          printf 'PAPERBATCH_CI_TEST_TEMP=%s\n' "$test_temp" >> "$GITHUB_ENV"

      - name: Build core contracts and run-state store
        id: build-core
        run: dotnet build src/PaperBatch.Core/PaperBatch.Core.csproj -p:NuGetAudit=false

      - name: Build compatibility probe
        id: build-probe
        run: dotnet build src/PaperBatch.CompatibilityProbe/PaperBatch.CompatibilityProbe.csproj -p:NuGetAudit=false

      - name: Build Avalonia desktop shell
        id: build-desktop
        run: dotnet build src/PaperBatch.Desktop/PaperBatch.Desktop.csproj --no-restore -p:NuGetAudit=false

      - name: Install pinned LibreOffice on hosted Linux
        id: install-libreoffice-linux
        if: runner.os == 'Linux'
        run: bash tools/install_libreoffice_linux.sh

      - name: Install pinned LibreOffice on hosted Windows
        id: install-libreoffice-windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/install_libreoffice_windows.ps1

      - name: Download and verify temporary PDFium fixture runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'pdfium-win-x64.tgz'
          $extract = Join-Path $env:RUNNER_TEMP 'paperbatch-pdfium-test'
          Invoke-WebRequest -Uri 'https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/8111/pdfium-win-x64.tgz' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3452d11031050ec65e57f180215b57b9e6d465e3fbedafa8a77ad90885c7d23e') { throw 'Pinned PDFium archive digest mismatch.' }
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          tar -xzf $archive -C $extract
          $dll = Get-ChildItem -Path $extract -Filter 'pdfium.dll' -File -Recurse | Select-Object -First 1
          if ($null -eq $dll) { throw 'Pinned PDFium archive did not contain pdfium.dll.' }
          if ((Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a318c39c137482dc4687c2973b7ec1c27fc1c20253cf2dc31928f922eab89e8f') { throw 'Pinned PDFium DLL digest mismatch.' }
          Add-Content $env:GITHUB_ENV "PAPERBATCH_PDFIUM_TEST_PATH=$($dll.FullName)"
          Add-Content $env:GITHUB_ENV 'PAPERBATCH_PDFIUM_TEST_SHA256=a318c39c137482dc4687c2973b7ec1c27fc1c20253cf2dc31928f922eab89e8f'
          Add-Content $env:GITHUB_ENV 'PAPERBATCH_PDFIUM_TEST_VERSION=chromium/8111'
          Add-Content $env:GITHUB_ENV "PAPERBATCH_PDFIUM_RUNTIME_PATH=$($dll.FullName)"
          Add-Content $env:GITHUB_ENV 'PAPERBATCH_PDFIUM_RUNTIME_SHA256=a318c39c137482dc4687c2973b7ec1c27fc1c20253cf2dc31928f922eab89e8f'

      - name: Run focused headless presentation tests
        id: headless-desktop-tests
        env:
          PAPERBATCH_APPLICATION_IMPORT_REPORT: ${{ runner.temp }}/paperbatch-application-import-report.json
          PAPERBATCH_LO_DIAGNOSTICS: '1'
        run: python tools/capture_bounded_command_output.py --output "${{ runner.temp }}/paperbatch-desktop-test-output.txt" -- dotnet run --project tests/PaperBatch.Desktop.Tests/PaperBatch.Desktop.Tests.csproj --no-restore -p:NuGetAudit=false

      - name: Upload bounded focused desktop test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paperbatch-desktop-test-output-${{ runner.os }}
          path: ${{ runner.temp }}/paperbatch-desktop-test-output.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload bounded PaperBatch application import report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paperbatch-application-import-${{ runner.os }}
          path: ${{ runner.temp }}/paperbatch-application-import-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Record .NET SDK version for print report
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV "PAPERBATCH_DOTNET_SDK_VERSION=$(dotnet --version)"

      - name: Run managed test runner
        id: managed-test-runner
        env:
          PAPERBATCH_PRINT_PATH_REPORT: ${{ runner.os == 'Windows' && format('{0}/windows-batch-print-contract.json', runner.temp) || '' }}
        run: dotnet run --project tests/PaperBatch.CompatibilityProbe.Tests/PaperBatch.CompatibilityProbe.Tests.csproj -p:NuGetAudit=false

      - name: Run bounded U7 fault, security, and stress matrix
        shell: bash
        run: |
          report="$RUNNER_TEMP/paperbatch-u9-fault-security-stress.json"
          dotnet run --project tests/PaperBatch.CompatibilityProbe.Tests/PaperBatch.CompatibilityProbe.Tests.csproj -p:NuGetAudit=false -- --fault-security-stress --report "$report"

      - name: Upload bounded U7 fault, security, and stress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u9-fault-security-stress-${{ matrix.os }}
          path: ${{ runner.temp }}/paperbatch-u9-fault-security-stress.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish bounded exact-run PaperBatch import summary
        id: application-import-summary
        if: always()
        env:
          PAPERBATCH_DESKTOP_TEST_OUTPUT: ${{ runner.temp }}/paperbatch-desktop-test-output.txt
        shell: bash
        run: python tools/build_application_import_ci_summary.py "$RUNNER_TEMP/paperbatch-application-import-report.json"

      - name: Verify PDFium vector composition on the pinned Windows runtime
        id: pdfiumverify
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rawOutputPath = Join-Path $env:RUNNER_TEMP 'paperbatch-pdfium-verification-raw.txt'
          & dotnet run --project tests/PaperBatch.CompatibilityProbe.Tests/PaperBatch.CompatibilityProbe.Tests.csproj -p:NuGetAudit=false *> $rawOutputPath
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            $reader = [System.IO.StreamReader]::new($rawOutputPath)
            try {
              $buffer = [char[]]::new(4096)
              $head = [System.Text.StringBuilder]::new()
              $tail = [System.Text.StringBuilder]::new()
              $totalRead = 0
              while ($true) {
                $chunkCount = $reader.Read($buffer, 0, $buffer.Length)
                if ($chunkCount -eq 0) { break }
                $totalRead += $chunkCount
                $headLength = [Math]::Max(0, [Math]::Min(3970 - $head.Length, $chunkCount))
                if ($headLength -gt 0) { [void]$head.Append($buffer, 0, $headLength) }
                $tailOffset = $headLength
                $tailLength = $chunkCount - $tailOffset
                if ($tailLength -gt 0) {
                  [void]$tail.Append($buffer, $tailOffset, $tailLength)
                  if ($tail.Length -gt 12000) { $tail.Remove(0, $tail.Length - 12000) }
                }
              }
              $boundedOutput = $head.ToString() + $tail.ToString()
              if ($totalRead -gt ($head.Length + $tail.Length)) { $boundedOutput = $head.ToString() + "`n[... middle omitted ...]`n" + $tail.ToString() }
            } finally {
              $reader.Dispose()
            }
            if ($env:RUNNER_TEMP) { $boundedOutput = $boundedOutput.Replace($env:RUNNER_TEMP, '[RUNNER_TEMP]') }
            if ($env:GITHUB_WORKSPACE) { $boundedOutput = $boundedOutput.Replace($env:GITHUB_WORKSPACE, '[WORKSPACE]') }
            $diagnosticPath = Join-Path $env:RUNNER_TEMP 'paperbatch-pdfium-verification.txt'
            Set-Content -Path $diagnosticPath -Value $boundedOutput -NoNewline
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '## Pinned PDFium verification failure'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'The test runner failed. Its bounded output follows; the fixture contains only synthetic PDF content.'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```text'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $boundedOutput
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          }
          exit $testExitCode

      - name: Run PDFium proof fixture self-tests
        run: dotnet run --project tests/PaperBatch.Pdfium.Windows.Tests/PaperBatch.Pdfium.Windows.Tests.csproj -p:NuGetAudit=false

      - name: Expose Windows managed test failure details
        if: failure() && runner.os == 'Windows' && steps.managed-test-runner.outcome == 'failure'
        shell: pwsh
        run: |
          $testLog = Join-Path $PWD 'windows-managed-test-retry.log'
          $testOutput = & dotnet run --project tests/PaperBatch.CompatibilityProbe.Tests/PaperBatch.CompatibilityProbe.Tests.csproj -p:NuGetAudit=false 2>&1
          $testExitCode = $LASTEXITCODE
          $testOutput | Set-Content -Path $testLog -Encoding utf8
          @(
            '### Windows managed test runner diagnostic retry'
            '```text'
            "Exit code: $testExitCode"
            (Get-Content -Path $testLog)
            '```'
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          Select-String -Path $testLog -Pattern '^FAIL ' | ForEach-Object {
            $diagnostic = $_.Line
            if ($env:GITHUB_WORKSPACE) { $diagnostic = $diagnostic.Replace($env:GITHUB_WORKSPACE, '[WORKSPACE]') }
            if ($env:RUNNER_TEMP) { $diagnostic = $diagnostic.Replace($env:RUNNER_TEMP, '[RUNNER_TEMP]') }
            if ($diagnostic.Length -gt 1000) { $diagnostic = $diagnostic.Substring(0, 1000) + ' [truncated]' }
            $diagnostic = $diagnostic.Replace('%', '%25').Replace(':', '%3A').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Managed test failure::$diagnostic"
          }

      - name: Expose Ubuntu managed test failure details
        if: failure() && runner.os == 'Linux' && steps.managed-test-runner.outcome == 'failure'
        shell: bash
        run: |
          test_log="$RUNNER_TEMP/ubuntu-managed-test-retry.log"
          if timeout --signal=TERM --kill-after=10s 5m dotnet run --project tests/PaperBatch.CompatibilityProbe.Tests/PaperBatch.CompatibilityProbe.Tests.csproj -p:NuGetAudit=false >"$test_log" 2>&1; then
            test_exit_code=0
          else
            test_exit_code=$?
          fi
          {
            echo '### Ubuntu managed test runner diagnostic retry'
            echo '```text'
            echo "Exit code: $test_exit_code"
            grep '^FAIL ' "$test_log" | head -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          failure_count=0
          while IFS= read -r diagnostic; do
            [ -n "$diagnostic" ] || continue
            failure_count=$((failure_count + 1))
            [ "$failure_count" -le 20 ] || break
            diagnostic=${diagnostic//"$GITHUB_WORKSPACE"/[WORKSPACE]}
            diagnostic=${diagnostic//"$RUNNER_TEMP"/[RUNNER_TEMP]}
            if [ "${#diagnostic}" -gt 1000 ]; then diagnostic="${diagnostic:0:1000} [truncated]"; fi
            diagnostic=${diagnostic//'%'/'%25'}
            diagnostic=${diagnostic//':'/'%3A'}
            diagnostic=${diagnostic//$'\r'/'%0D'}
            diagnostic=${diagnostic//$'\n'/'%0A'}
            printf '::error title=Managed test failure::%s\n' "$diagnostic"
          done < <(grep '^FAIL ' "$test_log" || true)

      - name: Expose macOS managed test failure details
        if: failure() && runner.os == 'macOS' && (steps.headless-desktop-tests.outcome == 'failure' || steps.managed-test-runner.outcome == 'failure')
        shell: bash
        run: |
          test_log="$RUNNER_TEMP/macos-managed-test-retry.log"
          if [ '${{ steps.headless-desktop-tests.outcome }}' = 'failure' ]; then
            test_project='tests/PaperBatch.Desktop.Tests/PaperBatch.Desktop.Tests.csproj'
          else
            test_project='tests/PaperBatch.CompatibilityProbe.Tests/PaperBatch.CompatibilityProbe.Tests.csproj'
          fi
          if python3 - "$test_project" "$test_log" <<'PYCODE'
          import os
          import signal
          import subprocess
          import sys

          command = 'set -o pipefail; dotnet run --project "$1" -p:NuGetAudit=false 2>&1 | tail -c 200000 > "$2"'
          process = subprocess.Popen(['bash', '-c', command, 'bash', sys.argv[1], sys.argv[2]], start_new_session=True)
          try:
              exit_code = process.wait(timeout=300)
          except subprocess.TimeoutExpired:
              os.killpg(process.pid, signal.SIGTERM)
              try:
                  process.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  os.killpg(process.pid, signal.SIGKILL)
                  process.wait()
              with open(sys.argv[2], 'a', encoding='utf-8') as output:
                  output.write('Diagnostic test retry timed out after 300 seconds.\n')
              exit_code = 124
          raise SystemExit(exit_code)
          PYCODE
          then
            test_exit_code=0
          else
            test_exit_code=$?
          fi
          diagnostic_log="$RUNNER_TEMP/macos-managed-test-diagnostics.txt"
          failure_log="$RUNNER_TEMP/macos-managed-test-failures.txt"
          python3 - "$test_log" "$diagnostic_log" "$failure_log" "$GITHUB_WORKSPACE" "$PAPERBATCH_CI_TEST_TEMP" "$RUNNER_TEMP" <<'PYCODE'
          import sys
          from pathlib import Path

          raw = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          for path, replacement in ((sys.argv[2], '[DIAGNOSTICS]'), (sys.argv[3], '[FAILURES]'), (sys.argv[4], '[WORKSPACE]'), (sys.argv[5], '[TEST_TEMP]'), (sys.argv[6], '[RUNNER_TEMP]')):
              raw = raw.replace(path, replacement)
          lines = raw.splitlines()
          failures = [line for line in lines if line.startswith('FAIL ')]
          selected = failures[:20] if failures else lines[-20:]
          bounded = '\n'.join(line[:500] for line in selected)
          Path(sys.argv[2]).write_text(bounded[:10000], encoding='utf-8')
          Path(sys.argv[3]).write_text('\n'.join(line[:500] for line in failures[:20])[:10000], encoding='utf-8')
          PYCODE
          {
            echo '### macOS managed test runner diagnostic retry'
            echo '```text'
            echo "Exit code: $test_exit_code"
            cat "$diagnostic_log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          failure_count=0
          while IFS= read -r diagnostic; do
            [ -n "$diagnostic" ] || continue
            failure_count=$((failure_count + 1))
            [ "$failure_count" -le 20 ] || break
            diagnostic=${diagnostic//'%'/'%25'}
            diagnostic=${diagnostic//':'/'%3A'}
            diagnostic=${diagnostic//$'\r'/'%0D'}
            diagnostic=${diagnostic//$'\n'/'%0A'}
            printf '::error title=Managed test failure::%s\n' "$diagnostic"
          done < "$failure_log"

      - name: Compile Python sources
        id: compile-python
        run: python -m compileall -q tools tests

      # Shared Python tests use deterministic fixtures; this matrix does not claim native print support.
      - name: Run Python unit tests
        if: runner.os == 'Linux'
        id: python-tests-linux
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run Python unit tests with bounded diagnostics (macOS)
        if: runner.os == 'macOS'
        id: python-tests-macos
        run: python tools/run_python_unit_tests_ci.py

      - name: Run Python unit tests with bounded diagnostics (Windows)
        if: runner.os == 'Windows'
        id: python-tests-windows
        run: python tools/run_python_unit_tests_ci.py

      - name: Capture Windows runner spooler and queue evidence
        id: windows-runner-capture
        if: runner.os == 'Windows' && always()
        shell: pwsh
        run: |
          ./tools/capture_windows_print_runner.ps1
          dotnet run --project src/PaperBatch.CompatibilityProbe/PaperBatch.CompatibilityProbe.csproj -p:NuGetAudit=false -- collect --include-local-queues --output windows-print-probe-report.json

      - name: Upload Windows runner print evidence
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-print-runner-evidence
          path: |
            windows-print-runner-evidence.json
            windows-print-probe-report.json
            windows-managed-test-retry.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload bounded Windows batch print contract report
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-batch-print-contract
          path: ${{ runner.temp }}/windows-batch-print-contract.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish bounded exact-run Windows batch print summary
        if: runner.os == 'Windows' && always()
        env:
          PB_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PB_JOB_RESULT: ${{ job.status }}
          PB_JOB_NAME: Windows batch print contract
          PB_STEP_OUTCOMES: '{"batch_print_contract":"${{ steps.managed-test-runner.outcome }}"}'
        run: python tools/build_ci_job_summary.py --title "Windows batch print contract" --report "${{ runner.temp }}/windows-batch-print-contract.json" --report-required

      - name: Upload bounded PDFium failure details
        if: failure() && runner.os == 'Windows' && steps.pdfiumverify.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-verification-diagnostics
          path: ${{ runner.temp }}/paperbatch-pdfium-verification.txt
          if-no-files-found: error
          retention-days: 2

      - name: Remove temporary PDFium test runtime
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'pdfium-win-x64.tgz')
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'paperbatch-pdfium-test')
          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'paperbatch-pdfium-verification.txt')
          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'paperbatch-pdfium-verification-raw.txt')

      - name: Publish bounded exact-run managed and runner summary
        if: always()
        env:
          PB_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PB_JOB_RESULT: ${{ job.status }}
          PB_JOB_NAME: ${{ matrix.os }} / .NET 10, Avalonia, and Python
          PB_STEP_OUTCOMES: '{"restore":"${{ steps.restore.outcome }}","build_core":"${{ steps.build-core.outcome }}","build_probe":"${{ steps.build-probe.outcome }}","build_desktop":"${{ steps.build-desktop.outcome }}","install_libreoffice_linux":"${{ steps.install-libreoffice-linux.outcome }}","install_libreoffice_windows":"${{ steps.install-libreoffice-windows.outcome }}","headless_tests":"${{ steps.headless-desktop-tests.outcome }}","application_import_summary":"${{ steps.application-import-summary.outcome }}","managed_tests":"${{ steps.managed-test-runner.outcome }}","python_compile":"${{ steps.compile-python.outcome }}","python_tests_linux":"${{ steps.python-tests-linux.outcome }}","python_tests_macos":"${{ steps.python-tests-macos.outcome }}","python_tests_windows":"${{ steps.python-tests-windows.outcome }}","windows_runner_capture":"${{ steps.windows-runner-capture.outcome }}"}'
        run: python tools/build_ci_job_summary.py --title "Managed tests and runner evidence" --report windows-print-runner-evidence.json

  windows-pdfium-community-proof:
    name: Windows hosted PDFium community proof
    runs-on: windows-latest
    env:
      PB_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Verify pinned PDFium and run native fixtures
        shell: pwsh
        run: ./tools/run_windows_pdfium_community_proof.ps1

      - name: Upload scoped PDFium compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-pdfium-community-proof
          path: ${{ runner.temp }}/paperbatch-pdfium-proof/report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish bounded exact-run PDFium summary
        if: always()
        env:
          PB_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PB_JOB_RESULT: ${{ job.status }}
          PB_JOB_NAME: Windows hosted PDFium community proof
        run: python tools/build_ci_job_summary.py --title "Windows PDFium runner evidence" --report "${{ runner.temp }}/paperbatch-pdfium-proof/report.json" --report-required

  ipp-protocol-fault-lab:
    name: Linux CUPS and IPP protocol simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run pinned CUPS/IPP fault lab
        run: tools/run_ipp_fault_lab.sh test
      - name: Publish bounded exact-run protocol summary
        if: always()
        env:
          PB_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PB_JOB_RESULT: ${{ job.status }}
          PB_JOB_NAME: Linux CUPS and IPP protocol simulation
        run: python tools/build_ci_job_summary.py --title "CUPS and IPP protocol simulation"

  u9-final-evidence-report:
    name: Bind U9 evidence to exact candidate and CI run
    if: always()
    needs:
      - windows-x64-lite-package
      - build-and-test
      - windows-pdfium-community-proof
      - ipp-protocol-fault-lab
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Generate exact-candidate U9 evidence report
        env:
          U9_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          U9_JOB_WINDOWS_X64_LITE_PACKAGE_RESULT: ${{ needs.windows-x64-lite-package.result }}
          U9_JOB_BUILD_AND_TEST_RESULT: ${{ needs.build-and-test.result }}
          U9_JOB_WINDOWS_PDFIUM_COMMUNITY_PROOF_RESULT: ${{ needs.windows-pdfium-community-proof.result }}
          U9_JOB_IPP_PROTOCOL_FAULT_LAB_RESULT: ${{ needs.ipp-protocol-fault-lab.result }}
        run: python tools/build_u9_final_evidence_report.py --output u9-final-evidence-report.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload exact-candidate U9 evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u9-final-evidence-report
          path: u9-final-evidence-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish bounded exact-run report-job summary
        if: always()
        env:
          PB_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PB_JOB_RESULT: ${{ job.status }}
          PB_JOB_NAME: Bind U9 evidence to exact candidate and CI run
        run: python tools/build_ci_job_summary.py --title "Exact-run report job status" --report u9-final-evidence-report.json --report-required

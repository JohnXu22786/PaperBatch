name: CI

on:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / .NET 10 and Python
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build compatibility probe
        run: dotnet build src/PaperBatch.CompatibilityProbe/PaperBatch.CompatibilityProbe.csproj -p:NuGetAudit=false

      - name: Run managed test runner
        run: dotnet run --project tests/PaperBatch.CompatibilityProbe.Tests/PaperBatch.CompatibilityProbe.Tests.csproj -p:NuGetAudit=false

      - name: Compile Python sources
        run: python -m compileall -q tools tests

      # The unit suite uses fixtures; pinned-engine LibreOffice export stays opt-in/local.
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p test_libreoffice_probe.py

  ipp-protocol-fault-lab:
    name: Ubuntu / pinned IPP protocol-fault lab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the pinned IPP lab image
        run: docker build --pull --platform linux/amd64 --file tools/ipp-lab/Dockerfile --tag paperbatch-ipp-lab:ci .

      - name: Run submit, query, cancel, and fault-classification tests
        run: >-
          docker run --rm --platform linux/amd64 --network none --read-only
          --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m --cap-drop=ALL
          --security-opt=no-new-privileges --pids-limit=64 --memory=512m --cpus=1
          paperbatch-ipp-lab:ci python3 -m unittest discover -s tests -p test_ipp_fault_lab.py

      - name: Emit redacted protocol-emulation trace for all scenarios
        run: >-
          docker run --rm --platform linux/amd64 --network none --read-only
          --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m --cap-drop=ALL
          --security-opt=no-new-privileges --pids-limit=64 --memory=512m --cpus=1
          paperbatch-ipp-lab:ci python3 tools/ipp_fault_lab.py run --scenario all
